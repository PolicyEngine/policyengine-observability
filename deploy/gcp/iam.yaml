service_accounts:
  collector:
    email: policyengine-otel-collector@policyengine-observability.iam.gserviceaccount.com
    project_roles:
      - roles/telemetry.writer
      - roles/serviceusage.serviceUsageConsumer
  modal:
    email: policyengine-api-v1-modal@policyengine-observability.iam.gserviceaccount.com
    project_roles:
      - roles/logging.logWriter
    collector_roles:
      - roles/run.invoker

collector_invokers:
  - policyengine-api-cr-runtime@policyengine-api.iam.gserviceaccount.com
  - policyengine-api-cr-staging@policyengine-api.iam.gserviceaccount.com
  - sim-entry-prod-runtime@policyengine-simulation-entry.iam.gserviceaccount.com
  - sim-entry-beta-runtime@policyengine-simulation-entry.iam.gserviceaccount.com
  - policyengine-api-v1-modal@policyengine-observability.iam.gserviceaccount.com

modal_workload_identity:
  pool_id: modal-api-v1
  provider_id: modal-api-v1
  issuer: https://oidc.modal.com
  allowed_audience: oidc.modal.com
  workspace_id: ac-AVO94gmhUEaFCuduiKdpRJ
  attribute_mapping:
    google.subject: assertion.app_name
    attribute.app_name: assertion.app_name
    attribute.environment_name: assertion.environment_name
    attribute.workspace_id: assertion.workspace_id
  attribute_condition: >-
    assertion.workspace_id == "ac-AVO94gmhUEaFCuduiKdpRJ" &&
    (assertion.environment_name == "main" || assertion.environment_name == "staging") &&
    (assertion.app_name == "policyengine-simulation-gateway" ||
    assertion.app_name.matches("^policyengine-simulation-py[0-9]+-[0-9]+-[0-9]+$"))
