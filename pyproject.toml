[project]
name = "policyengine-observability"
version = "2.0.0"
description = "Shared PolicyEngine observability runtime for logs, timings, metrics, and OpenTelemetry."
readme = "README.md"
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
otlp-grpc = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
otlp-http = [
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
flask = [
    "flask>=2.2",
]
fastapi = [
    "fastapi",
]
httpx = [
    "httpx",
]
google = [
    "google-auth>=2.38.0",
    "google-cloud-logging>=3.15.0",
]
all = [
    "fastapi",
    "flask>=2.2",
    "google-auth>=2.38.0",
    "google-cloud-logging>=3.15.0",
    "httpx",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
]
dev = [
    "build",
    "coverage",
    "pytest",
    "pyright>=1.1.405",
    "ruff>=0.9.0",
    "towncrier>=24.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyengine_observability"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.codex",
    "/.pytest_cache",
    "/.venv",
    "/dist",
    "/openspec",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["policyengine_observability"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.coverage.run]
branch = true
source = ["policyengine_observability"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.towncrier]
package = "policyengine_observability"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
